#version: "3.2"
services:
  backend:
    build:
      context: ./backend
      target: dev   
    working_dir: /app/Desconecta
    volumes:
      - ./backend/Desconecta:/app/Desconecta
      - maven-repo:/root/.m2

    ports:
      - "8080:8080"
    command: tail -f /dev/null #container roda ocioso
    
    environment:
      SPRING_PROFILE: dev
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    env_file:
      - .env
    networks:
      - dev-network

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: frontend
    working_dir: /app
    volumes:
      - ./frontend:/app       # código do host
      - frontend_node_modules:/app/node_modules  # node_modules isolado
    ports:
      - "5173:5173"
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  frontend_node_modules:
  maven-repo:
